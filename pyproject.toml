[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bbwarden"
dynamic = ["version"]
description = "Bitbucket least-privilege and offboarding CLI"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["atlassian-python-api>=3.41", "requests>=2.32.4", "idna>=2.5,<4", "urllib3>=1.26,<3"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.6", "mypy>=1.10", "types-requests", "hypothesis>=6"]

[project.scripts]
bbwarden = "bbwarden._entry:run"

[tool.setuptools.dynamic]
version = {attr = "bbwarden.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
check_untyped_defs = true
warn_unused_ignores = true
