[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bbwarden"
dynamic = ["version"]
description = "Bitbucket least-privilege and offboarding CLI"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["atlassian-python-api>=3.41"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
bbwarden = "bbwarden.cli:main"

[tool.setuptools.dynamic]
version = {attr = "bbwarden.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
